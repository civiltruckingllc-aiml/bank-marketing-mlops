# Each override is merged with train.yaml; all runs share identical splits.
experiments:
  - name: logistic-c-0.1
    model:
      type: logistic_regression
      params: {C: 0.1, max_iter: 1500, class_weight: balanced, solver: lbfgs}
  - name: logistic-c-1
    model:
      type: logistic_regression
      params: {C: 1.0, max_iter: 1500, class_weight: balanced, solver: lbfgs}
  - name: forest-depth-6
    model:
      type: random_forest
      params: {n_estimators: 80, max_depth: 6, min_samples_leaf: 10, class_weight: balanced, n_jobs: 2}
  - name: forest-depth-10
    model:
      type: random_forest
      params: {n_estimators: 120, max_depth: 10, min_samples_leaf: 5, class_weight: balanced, n_jobs: 2}
  - name: forest-depth-14
    model:
      type: random_forest
      params: {n_estimators: 150, max_depth: 14, min_samples_leaf: 4, class_weight: balanced, n_jobs: 2}
