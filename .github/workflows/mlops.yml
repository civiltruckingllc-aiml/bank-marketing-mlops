name: MLOps pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "42"
  OMP_NUM_THREADS: "2"
  OPENBLAS_NUM_THREADS: "2"
  MLFLOW_ENABLE_SYSTEM_METRICS_LOGGING: "false"
  DO_NOT_TRACK: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Restore versioned dataset from public source
        run: dvc pull
      - name: Run complete test suite
        run: pytest tests/ -v --junitxml=reports/pytest.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results
          path: reports/pytest.xml

  train:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned dependencies
        run: pip install -r requirements.txt
      - name: Restore versioned dataset
        run: dvc pull
      - name: Train five experiments and enforce validation gates
        run: python -m src.run_experiments
      - name: Verify selected model on untouched holdout
        run: python -m src.evaluate
      - name: Check stable production simulation
        run: python -m src.monitor_drift --mode baseline
      - name: Confirm drift alarm returns exactly one
        run: |
          set +e
          python -m src.monitor_drift --mode drifted
          status=$?
          set -e
          test "$status" -eq 1
      - name: Store trained models, MLflow history, and reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlops-training-evidence
          path: |
            artifacts/
            reports/
          retention-days: 30
